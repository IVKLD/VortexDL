<div class="stats-container">
    @for (stat of stats(); track stat.label) {
        <app-stat-card
                [iconClass]="stat.iconClass"
                [icon]="stat.icon"
                [label]="stat.label"
                [value]="stat.isSize ? (stat.value | fileSize) : stat.value"/>
    }
</div>

<main>
    <div class="left-column">
        @defer (on idle) {
            <app-activity-chart [data]="activityData()"/>
        } @placeholder {
            <div class="section-placeholder"></div>
        }

        <app-active-queue/>
    </div>

    <div class="right-column">
        @defer (on idle) {
            <app-format-breakdown [data]="formatBreakdown()"/>
        } @placeholder {
            <div class="section-placeholder"></div>
        }

        @defer (on idle) {
            <app-recent-tracks (playTrack)="playTrack($event)" [tracks]="recentTracks()"/>
        } @placeholder {
            <div class="section-placeholder"></div>
        }
    </div>
</main>
