<app-section-header icon="cloud_download" title="Active Queue"/>

@if (tracking.activeDownloads().length > 0) {
    <div class="wrapper">
        <app-active-downloads/>
    </div>
} @else {
    <div class="empty">
        <mat-icon>done_all</mat-icon>
        <p>No active downloads. Queue some tracks to get started!</p>
    </div>
}
