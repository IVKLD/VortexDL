<header>
    <h2>
        <mat-icon>bar_chart</mat-icon>
        Activity
    </h2>
    <div class="legend">
        <span class="dl">Downloads</span>
        <span class="del">Deleted</span>
    </div>
</header>

@if (data().length > 0) {
    <div class="chart">
        @for (item of data(); track item.label) {
            <div class="bar-col">
                <div class="bars">
                    <div class="bar dl" [style.height]="item.downloadHeightPercent + '%'" [title]="item.downloadCount + ' downloaded'"></div>
                    <div class="bar del" [style.height]="item.deleteHeightPercent + '%'" [title]="item.deleteCount + ' deleted'"></div>
                </div>
                <span>{{ item.label }}</span>
            </div>
        }
    </div>
} @else {
    <app-empty-pane
        icon="bar_chart"
        heading="No activity data"
        description="Download or delete tracks to see your activity."
        [accent]="false" />
}
