<app-section-header [link]="{label: 'Library', url: '/musics'}" icon="history" title="Recently Added"/>

<div>
    @for (track of tracks(); track track.id) {
        <app-music-card [track]="track"/>
    } @empty {
        <div class="empty">
            <mat-icon>music_off</mat-icon>
            <p>No tracks in library yet.</p>
        </div>
    }
</div>
