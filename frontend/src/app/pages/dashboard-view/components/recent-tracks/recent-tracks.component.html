<section class="recent-tracks-section">
    <div class="section-header">
        <h2>
            <mat-icon>history</mat-icon>
            Recently Added
        </h2>
        <a class="view-all" routerLink="/music-tracks">Library</a>
    </div>

    <div class="recent-tracks-list">
        @for (track of tracks(); track track.id) {
            <div class="recent-track-card">
                <div class="artwork">
                    @if (track.artworkUrl) {
                        <img [alt]="track.title" [ngSrc]="track.artworkUrl" height="48" width="48">
                    } @else {
                        <div class="placeholder-art">
                            <mat-icon>music_note</mat-icon>
                        </div>
                    }
                </div>
                <div class="track-info">
                    <h4 [title]="track.title" class="track-title">{{ track.title }}</h4>
                    <span class="track-artist">{{ track.artist }}</span>
                    <span class="track-format">{{ track.format | uppercase }}</span>
                </div>
            </div>
        } @empty {
            <div class="empty-state">
                <mat-icon>music_off</mat-icon>
                <p>No tracks in library yet.</p>
            </div>
        }
    </div>
</section>
