<header>
    <h2>
        <mat-icon>pie_chart</mat-icon>
        Audio Formats
    </h2>
</header>

@if (data().length > 0) {
    <section>
        @for (fmt of data(); track fmt.format) {
            <div>
                <div>
                    <span [style.background]="fmt.color"></span>
                    <strong>{{ fmt.format }}</strong>
                    <em>{{ fmt.count }}</em>
                </div>
                <mat-progress-bar
                    mode="determinate"
                    [value]="fmt.percentage"
                    [style.--mdc-linear-progress-active-indicator-color]="fmt.color" />
            </div>
        }
    </section>
} @else {
    <app-empty-pane
        icon="pie_chart"
        heading="Library is empty"
        description="Download music to see format breakdown."
        [accent]="false" />
}
