<form id="settings-form" [formRoot]="settingsForm" (focusout)="submitBtn.click()">
    <app-soundcloud-section [form]="settingsForm.soundcloud" [isTesting]="isTesting()"
        (testSoundcloud)="testSoundcloud()" />

    <app-downloads-section [downloadsForm]="settingsForm.downloads" [systemForm]="settingsForm.system" />

    <app-network-section [form]="settingsForm.network" [isTesting]="isNetworkTesting()" (testProxy)="testProxy()" />

    <app-adb-section [form]="settingsForm.adb" [connectedDevices]="connectedDevices()" [isRefreshing]="isRefreshing()"
        (refresh)="refreshDevices()" (removeDevice)="removeDevice($event)" />

    <button #submitBtn type="submit" style="display: none;"></button>
</form>
