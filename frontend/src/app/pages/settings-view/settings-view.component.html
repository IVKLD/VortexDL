<form id="settings-form" [formRoot]="settingsForm">
    <ng-template appHeaderTemplate>
        <app-settings-save-button [disabled]="saveButtonDisabled()"/>
    </ng-template>

    <div class="settings-content">
        <app-soundcloud-section (test)="testSoundcloud()" [form]="settingsForm.soundcloud"
            [isTesting]="isTesting()" />

        <app-downloads-section [downloadsForm]="settingsForm.downloads" [systemForm]="settingsForm.system" />

        <app-network-settings (test)="testProxy()" [form]="settingsForm.network" [isTesting]="isNetworkTesting()" />

        <app-adb-section [form]="settingsForm.adb" />
    </div>
</form>
