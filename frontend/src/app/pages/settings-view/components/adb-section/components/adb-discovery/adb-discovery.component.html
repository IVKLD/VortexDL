<header>
    <h3>Discovered Devices</h3>
    <span class="hint">Click a device to add it to the sync list</span>
    <button (click)="refreshDevices()" [disabled]="isRefreshing()" mat-icon-button type="button">
        <mat-icon [class.spinning]="isRefreshing()">refresh</mat-icon>
    </button>
</header>

@if (availableDevices().length > 0) {
    <div class="chip-list">
        @for (device of availableDevices(); track device) {
            <button (click)="selectDevice.emit(device)" class="chip" type="button">
                <mat-icon>usb</mat-icon>
                {{ device }}
            </button>
        }
    </div>
} @else {
    <p>No connected ADB devices found</p>
}
