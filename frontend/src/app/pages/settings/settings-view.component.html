<div class="settings-card">
    <header>
        <mat-icon>settings</mat-icon>
        <div class="title-group">
            <h1>Settings</h1>
            <p>Configure your SoundCloud synchronization and system preferences</p>
        </div>
    </header>

    @if (isLoading()) {
        <div class="loading-state">
            <div class="spinner"></div>
            <span>Loading configuration...</span>
        </div>
    } @else {
        <form [formRoot]="settingsForm">
            <div class="settings-content">
                <app-soundcloud-section (test)="testSoundcloudUrl()" [form]="settingsForm.soundcloud"
                                        [isTesting]="isTesting()"/>

                <app-downloads-section [form]="settingsForm.downloads"/>

                <app-system-section [form]="settingsForm.system"/>
            </div>

            <div class="footer">
                <button [disabled]="settingsForm().invalid() || isTesting()" mat-flat-button type="submit">
                    <mat-icon>save</mat-icon>
                    Save All Changes
                </button>
            </div>
        </form>
    }
</div>
