<section class="settings-section">
    <h2>
        <mat-icon>download_for_offline</mat-icon>
        Download Preferences
    </h2>
    <div class="section-content">
        <mat-form-field class="full-width">
            <mat-label>Output Directory</mat-label>
            <input [formField]="form().outputPath" matInput placeholder="./downloads">
            <mat-icon matPrefix>folder</mat-icon>
            <mat-hint>Absolute or relative path where files will be saved</mat-hint>
        </mat-form-field>

        <div class="field-group">
            <mat-form-field>
                <mat-label>Naming Template</mat-label>
                <input [formField]="form().namingTemplate" matInput
                       placeholder="{artist} - {title}">
                <mat-icon matPrefix>title</mat-icon>
                <mat-hint>Available: &#123;artist&#125;, &#123;title&#125;, &#123;id&#125;</mat-hint>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Max Concurrent Downloads</mat-label>
                <input [formField]="form().maxConcurrent" matInput type="number">
                <mat-icon matPrefix>dynamic_feed</mat-icon>
                <mat-hint>Recommended: 3-5 for stability</mat-hint>
            </mat-form-field>
        </div>
    </div>
</section>
