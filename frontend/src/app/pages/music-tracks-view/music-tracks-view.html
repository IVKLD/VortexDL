<app-list-view-shell [loading]="state.isLoading() || state.search.isSearching()" [hasResults]="tracks().length > 0"
    [empty]="state.search.hasQuery() && tracks().length === 0"
    [initial]="state.search.isEmpty() && tracks().length === 0">

    <app-search-skeleton skeleton />

    <ng-container results>
        <rx-virtual-scroll-viewport [itemSize]="82" scrollWindow>
            <app-music-card #card *rxVirtualFor="let track of tracks(); trackBy: 'id'"
                [appDragSelect]="track" [selection]="state.selection" (itemClick)="handleCardClick($event)"
                [isActive]="activeTrackId() === track.id" [isPlaying]="player.isTrackPlaying(track.id)"
                [isLoadingStream]="player.loadingTrackId() === track.id"
                [isSelected]="state.selection.has(track.id)" [track]="track" (playTrack)="playTrack(track)"
                [matContextMenuTriggerFor]="cardMenu">
                <aside meta>
                    @if ((track.sourceUrl || track.permalinkUrl) | platform; as platform) {
                        <app-platform-chip [platform]="platform" />
                    }
                    <span>{{ track.size | fileSize }}</span>
                    @if (track.format && track.format !== AudioFormat.UNKNOWN) {
                        <strong [attr.data-format]="track.format">{{ track.format }}</strong>
                    }
                </aside>

                <div actions class="actions-wrapper">
                    <menu role="presentation">
                        <button [matMenuTriggerFor]="cardMenu" (click)="$event.stopPropagation()" mat-icon-button>
                            <mat-icon>more_vert</mat-icon>
                        </button>
                    </menu>

                    <mat-menu #cardMenu="matMenu">
                        <button mat-menu-item (click)="playTrack(track)">
                            <mat-icon>{{ card.isPlaying() ? 'pause' : 'play_arrow' }}</mat-icon>
                            <span>{{ card.isPlaying() ? 'Pause' : 'Play' }}</span>
                        </button>
                        <button mat-menu-item (click)="state.selection.toggle(track.id)">
                            <mat-icon>{{ card.isSelected() ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
                            <span>{{ card.isSelected() ? 'Deselect' : 'Select' }}</span>
                        </button>
                        <button mat-menu-item (click)="actions.download(track)">
                            <mat-icon>download</mat-icon>
                            <span>Download</span>
                        </button>
                        <button mat-menu-item class="delete-menu-item" (click)="actions.delete([track.id])">
                            <mat-icon>delete</mat-icon>
                            <span>Delete</span>
                        </button>
                    </mat-menu>
                </div>
            </app-music-card>
        </rx-virtual-scroll-viewport>
    </ng-container>

    <app-empty-pane empty icon="search_off" heading="No results found" description="Try a different search query" />

    <app-empty-pane initial icon="library_music" heading="No tracks yet"
        description="Your library is empty. Go to Dashboard to start downloading music." [accent]="true" />
</app-list-view-shell>

@if (state.selection.hasSelection()) {
<app-selection-bar [count]="state.selection.count()" (deleteSelected)="deleteSelected()"
    (clearSelection)="state.selection.clear()" />
}
