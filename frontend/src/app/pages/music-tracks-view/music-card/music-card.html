@let data = track();

<div (click)="trackClick.emit()" class="music-card" role="button" tabindex="0">
    <div class="artwork">
        @if (data.artworkUrl) {
            <img [alt]="data.filename" [ngSrc]="data.artworkUrl" height="42" width="42"/>
        } @else {
            <div class="placeholder">
                <mat-icon>music_note</mat-icon>
            </div>
        }
    </div>

    <div class="content">
        <div class="info">
            <h3 class="title text-truncate">{{ displayTitle() }}</h3>
            <span class="album text-truncate">{{ data.album }}</span>
        </div>
        <div class="meta">
            <span class="file-size">
                {{ data.size | fileSize }}
            </span>

            <span [attr.data-format]="data.format" class="badge">
                {{ data.format }}
            </span>
        </div>

        <div (click)="$event.stopPropagation()" class="actions" role="presentation">
            <button (click)="deleteMusic.emit()" mat-icon-button>
                <mat-icon>delete</mat-icon>
            </button>
        </div>
    </div>
</div>
