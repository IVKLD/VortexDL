<app-list-view-shell [loading]="state.loading() && state.results().length === 0"
    [hasResults]="state.results().length > 0" [empty]="isEmpty()" [initial]="isInitial()">

    <app-search-skeleton skeleton />

    <ng-container results>
        <rx-virtual-scroll-viewport [itemSize]="82" scrollWindow (viewRange)="onViewRange($event)">
            <app-search-result-item *rxVirtualFor="let track of state.results(); trackBy: 'id'" [track]="track"
                [isPlaying]="player.isTrackPlaying(track.id)" [isDownloaded]="downloadedIds().has(track.id)"
                [isDownloading]="downloadingIds().has(track.id)" (playTrack)="togglePlay($event)"
                (downloadTrack)="downloadTrack($event)" (deleteTrack)="deleteTrack($event)" />
        </rx-virtual-scroll-viewport>

        @if (state.loading() && state.results().length > 0) {
            <div class="load-more-indicator">
                <mat-spinner diameter="22" />
                <span>Loading more tracks...</span>
            </div>
        }
    </ng-container>

    <app-empty-pane empty icon="search_off" heading="No results found" description="Try a different search query" />

    <ng-container initial>
        <app-empty-pane icon="travel_explore" heading="Search SoundCloud"
            description="Find tracks, artists and music to download" [accent]="true" />
    </ng-container>
</app-list-view-shell>

@if (history.history().length > 0 && state.showHistory()) {
    <app-search-history-panel animate.enter="history-enter" animate.leave="history-leave" (selectItem)="selectHistoryItem($event)" />
}
