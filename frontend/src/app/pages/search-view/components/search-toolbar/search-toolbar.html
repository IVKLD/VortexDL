<div class="search-toolbar">
    <div class="provider-filters">

        <button
            type="button"
            class="filter-chip youtube"
            [class.active]="state.provider() === SearchProvider.YouTube"
            (click)="setProvider(SearchProvider.YouTube)"
        >
            <mat-icon class="chip-icon">play_circle_filled</mat-icon>
            <span>YouTube</span>
        </button>

        <button
            type="button"
            class="filter-chip soundcloud"
            [class.active]="state.provider() === SearchProvider.SoundCloud"
            (click)="setProvider(SearchProvider.SoundCloud)"
        >
            <mat-icon class="chip-icon">cloud</mat-icon>
            <span>SoundCloud</span>
        </button>
    </div>

    @if (state.provider() === SearchProvider.YouTube) {
        <div class="sort-actions">
            <button [cdkMenuTriggerFor]="durationMenu" type="button" class="sort-button">
                <mat-icon>schedule</mat-icon>
                <span>
                    @switch (state.duration()) {
                        @case (SearchDurationFilter.Short) { Short (&lt; 2m) }
                        @case (SearchDurationFilter.Medium) { Medium (2-10m) }
                        @case (SearchDurationFilter.Long) { Long (10-30m) }
                        @case (SearchDurationFilter.Epic) { Mixes (&gt; 30m) }
                        @default { Any length }
                    }
                </span>
                <mat-icon class="arrow">arrow_drop_down</mat-icon>
            </button>

            <ng-template #durationMenu>
                <div cdkMenu>
                    <button cdkMenuItem (click)="setDuration(SearchDurationFilter.Any)" [class.active-item]="state.duration() === SearchDurationFilter.Any">
                        <mat-icon>all_inclusive</mat-icon>
                        <span>Any length</span>
                    </button>
                    <button cdkMenuItem (click)="setDuration(SearchDurationFilter.Short)" [class.active-item]="state.duration() === SearchDurationFilter.Short">
                        <mat-icon>timer</mat-icon>
                        <span>Short (&lt; 2 min)</span>
                    </button>
                    <button cdkMenuItem (click)="setDuration(SearchDurationFilter.Medium)" [class.active-item]="state.duration() === SearchDurationFilter.Medium">
                        <mat-icon>schedule</mat-icon>
                        <span>Medium (2 – 10 min)</span>
                    </button>
                    <button cdkMenuItem (click)="setDuration(SearchDurationFilter.Long)" [class.active-item]="state.duration() === SearchDurationFilter.Long">
                        <mat-icon>timelapse</mat-icon>
                        <span>Long (10 – 30 min)</span>
                    </button>
                    <button cdkMenuItem (click)="setDuration(SearchDurationFilter.Epic)" [class.active-item]="state.duration() === SearchDurationFilter.Epic">
                        <mat-icon>queue_music</mat-icon>
                        <span>Mixes / Sets (&gt; 30 min)</span>
                    </button>
                </div>
            </ng-template>
        </div>
    }
</div>
