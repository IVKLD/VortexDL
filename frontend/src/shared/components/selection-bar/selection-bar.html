<span>{{ count() }} selected</span>

<div class="actions pill-group">
    <button (click)="deleteSelected.emit()" matTooltip="Delete"
            mat-flat-button>
        <mat-icon>delete</mat-icon>
    </button>

    <mat-divider vertical/>

    <button (click)="clearSelection.emit()" mat-flat-button matTooltip="Close">
        <mat-icon>minimize</mat-icon>
    </button>
</div>
