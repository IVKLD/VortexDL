<svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="44"/>
    <circle #progressCircle cx="50" cy="50" r="44" stroke-dashoffset="276.46"/>
</svg>

<button (click)="player.togglePlay(); $event.stopPropagation()"
        (mousedown)="$event.stopPropagation()"
        (touchstart)="$event.stopPropagation()"
        matButton="tonal"
>
    @if (player.loadingTrackId()) {
        <mat-spinner diameter="20"/>
    } @else {
        <mat-icon>{{ playIcon() }}</mat-icon>
    }
</button>

<span #timerText>0:00 / 0:00</span>
