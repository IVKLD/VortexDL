@let track = data();

<div class="cover-wrapper" (click)="openDetailModal()" role="button" tabindex="0">
    @if (track.artworkUrl) {
    <img [ngSrc]="track.artworkUrl" alt="Artwork" height="160" width="160">
    } @else {
    <div class="placeholder">
        <mat-icon>music_note</mat-icon>
    </div>
    }
    <div class="overlay-hint">
        <mat-icon>info</mat-icon>
    </div>
</div>

<div class="details">
    <h3>{{ track.title }}</h3>
    <p>{{ track.artist }}</p>
</div>
