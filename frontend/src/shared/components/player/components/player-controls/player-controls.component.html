<div class="main-controls">
    <button (click)="player.previous()" mat-icon-button>
        <mat-icon>skip_previous</mat-icon>
    </button>

    <app-player-dial />

    <button (click)="player.next()" mat-icon-button>
        <mat-icon>skip_next</mat-icon>
    </button>
</div>

<div class="sub-controls">
    <button (click)="player.toggleShuffle()" [class.active]="player.shuffle()" mat-icon-button class="shuffle-btn">
        <mat-icon>shuffle</mat-icon>
    </button>
</div>
