<div class="plate">
    <div class="header">
        <span>Errors</span>
        <button (click)="onClear()" class="clear-all-btn">Clear All</button>
    </div>
    <div class="list">
        @for (err of errors(); track $index) {
            <div class="item">
                <mat-icon>error_outline</mat-icon>
                <span class="message">{{ err }}</span>
            </div>
        }
    </div>
</div>
