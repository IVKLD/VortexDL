@let itemList = items();

<header>
    <span>Active Downloads</span>
    @if (itemList.length > 0) {
        <mark>{{ itemList.length }}</mark>
    }
</header>

<rx-virtual-scroll-viewport [itemSize]="52">
    <app-active-download-item *rxVirtualFor="let item of itemList; trackBy: 'id'"
                              (remove)="remove.emit($event)"
                              [item]="item"/>
</rx-virtual-scroll-viewport>
