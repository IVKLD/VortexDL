@let data = track();

<div class="artwork">
    @if (data.artworkUrl) {
        <img [alt]="data.title" [ngSrc]="data.artworkUrl" height="48" width="48" />
    } @else {
        <mat-icon>music_note</mat-icon>
    }

    <button type="button"
            class="play-overlay"
            [class.visible]="isPlaying() || isLoadingStream()"
            (click)="$event.stopPropagation(); playTrack.emit(data)">
        @if (isLoadingStream()) {
            <mat-spinner diameter="20"/>
        } @else {
            <mat-icon>{{ isPlaying() ? 'pause' : 'play_arrow' }}</mat-icon>
        }
    </button>
</div>

<div class="info">
    <section>
        <h3>{{ data.title }}</h3>
        <span>{{ data.artist }}</span>
    </section>

    <ng-content select="[meta]"/>
    <ng-content select="[actions]"/>
</div>
