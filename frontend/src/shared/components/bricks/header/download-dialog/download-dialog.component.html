<h2 mat-dialog-title>Download Music</h2>

<mat-dialog-content>
    <mat-form-field>
        <mat-label>
            <mat-icon>link</mat-icon>
            SoundCloud URL
        </mat-label>
        <input
                (keyup.enter)="onDownload()"
                [formField]="urlField"
                matInput
        />
        @if (urlField().invalid()) {
            <mat-error>{{ urlField().errors()[0]?.message }}</mat-error>
        }
        <mat-hint>Liked, Playlist, or Track URL</mat-hint>
    </mat-form-field>

    <div>
        @if (history.length > 0) {
            <div class="history-section">
                <h3>Recent URLs</h3>
                <mat-list>
                    @for (item of history; track item) {
                        <mat-list-item (click)="selectHistory(item)"
                                       [class.active]="urlField().value() === item"
                        >
                            <div class="item">
                                <span>{{ item }}</span>
                                <button (click)="removeFromHistory(item)" mat-icon-button>
                                    <mat-icon>close</mat-icon>
                                </button>
                            </div>
                        </mat-list-item>
                    }
                </mat-list>
            </div>
        }
    </div>
</mat-dialog-content>

<mat-dialog-actions>
    <button mat-button mat-dialog-close>Cancel</button>
    <button (click)="onDownload()" [disabled]="urlField().invalid()" mat-flat-button>Download</button>
</mat-dialog-actions>
