<div class="page-info">
    <div class="stats-label">
        <span class="label-text">Vortex</span>
        <span>{{ config()?.title || 'System' }}</span>
    </div>

    @if (hasFeature(Feature.Stats)) {
        <span class="separator">//</span>
        <div class="stats-value">
            <span class="label-text">Tracks</span>
            <span>
                {{ musicState.count_tracks() }}
            </span>
        </div>
    }
</div>
