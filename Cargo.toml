[package]
name = "vortex-dl"
version = "0.4.4"
default-run = "vortex-dl"
edition = "2024"
repository = "https://github.com/IVKLD/VortexDL"
license = "GPL-3.0-only"
[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "net", "sync", "process"], default-features = false }
futures = "0.3.32"
clap = { version = "4.6.1", features = ["derive", "env"] }
url = { version = "2.5.8", features = ["serde"] }
mimalloc = "0.1.50"
soundcloud-rs = { path = "libs/soundcloud-rs" }
colored = "3.1.1"
indicatif = "0.18.4"
id3 = "1.16.4"
axum = { version = "0.8", features = ["macros", "ws"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "query", "socks"] }
anyhow = "1.0.102"
rust-embed = "8.11.0"
mime_guess = "2.0.5"
redb = "4.1.0"
dirs = "6.0.0"
deunicode = "1.6.2"
symphonia = { version = "0.5.4", features = ["all"] }
utoipa = { version = "5.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum", "vendored"] }
notify = "8.2.0"


[dev-dependencies]
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
opt-level = "z"     # Optimize for size
lto = true          # Full LTO
codegen-units = 1   # Maximum optimization
panic = "abort"     # Remove unwinding code

[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
