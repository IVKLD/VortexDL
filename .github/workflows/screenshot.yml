name: Auto Website Screenshot

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  take_screenshot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Capture Website Screenshot
        uses: karol-brejna-i/webpage-screenshot-action@v1
        with:
          url: https://github.com/IVKLD/VortexDL
          output: website-screenshot.png
          
      - name: Commit and push screenshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update auto-screenshot [skip ci]"
          file_pattern: "website-screenshot.png"
