name: Auto Website Screenshot

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  take_screenshot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Capture Website Screenshot
        uses: swinton/screenshot-website@v1.x
        with:
          source: https://github.com/IVKLD/VortexDL
          destination: website-screenshot.png
          width: 1920
          height: 1080
          
      - name: Commit and push screenshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update auto-screenshot [skip ci]"
          file_pattern: "website-screenshot.png"
